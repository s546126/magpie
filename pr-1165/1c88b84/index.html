<main><h1>#1165 界面预览</h1><p class="m">commit 1c88b84 · <a href="https://github.com/yetone/magpie/pull/1165">回到 PR</a> · 供应商编辑器里，本地预设（Ollama、LM Studio、oMLX）在密钥下方新增了默认折叠的「服务器地址」区块：填入端口或另一台电脑的地址后，终结点预览按新地址改写（各 API 保留自己的路径），地址不是地址时会展开并提示；LM Studio 与 oMLX 的说明文字也改成了「默认端口 1234/8000」。</p>
