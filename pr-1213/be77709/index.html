<main><h1>#1213 界面预览</h1><p class="m">commit be77709 · <a href="https://github.com/yetone/magpie/pull/1213">回到 PR</a> · 只改 app.js：用鼠标按住页面自己的滚动条（指针落在 .view 的滚动条带内）时把它记为一次读者的滚动，拖动期间的 scroll 不再被「回到读者位置」机制拉回；按下滚动条同时放开点击后的 4 秒保持，并在松手后再给读者的窗口留 250ms，接住 WebKit 松手之后才到的最后几次 scroll。</p>
